<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Familiares</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6F5C">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F3F7F5; --surface:#FFFFFF; --surface2:#EAF1EC;
  --border:#DEE8E2; --border2:#C8D6CD;
  --text:#182420; --text2:#57685F; --text3:#8CA097;
  --teal:#1F6F5C; --teal-dark:#134238; --teal-light:#DCEEE8;
  --amber:#B9821F; --amber-dark:#8A611A; --amber-light:#FBEFD7;
  --red:#B23B30; --red-dark:#8A2C24; --red-light:#FAE3E0;
  --green:#2E7D46; --green-light:#E1F2E5;
  --slate:#4A5C68; --slate-light:#E4ECEF;
  --radius:14px; --radius-sm:9px;
  --shadow:0 2px 12px rgba(20,40,32,0.07);
  --shadow-lg:0 10px 32px rgba(20,40,32,0.14);
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.page-wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px;}
h1,h2,h3{font-family:var(--font);color:var(--text);}
button{font-family:var(--font);}
input,select,textarea{font-family:var(--font);}
a{color:var(--teal);}

/* ---- Layout shell ---- */
.topbar{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:180px;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-0.01em;}
.brand-sub{font-size:11px;color:var(--text3);font-weight:500;}
.month-picker{display:flex;align-items:center;gap:8px;}
.month-picker input{border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;background:var(--surface);color:var(--text);}

.tabs-wrap{position:relative;margin-bottom:20px;}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;}
.tabs-wrap::after{content:'';position:absolute;right:0;top:0;bottom:4px;width:32px;background:linear-gradient(to right, transparent, var(--bg));pointer-events:none;}
.tab{padding:10px 14px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;border:none;background:transparent;position:relative;top:1px;display:inline-flex;align-items:center;gap:7px;}
.tab.active{color:var(--teal-dark);background:var(--surface);border:1px solid var(--border);border-bottom:1px solid var(--surface);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.card + .card{margin-top:14px;}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:820px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
.stat-label{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.stat-value{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-0.01em;}
.stat-value.pos{color:var(--green);}
.stat-value.neg{color:var(--red);}

.section-title{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:10px;}
.section-title .hint{font-size:12px;font-weight:500;color:var(--text3);}
@media (max-width:480px){
  .section-title{flex-direction:column;align-items:flex-start;}
  .section-title .btn{width:100%;justify-content:center;}
  .tx-item{flex-wrap:wrap;}
  .tx-item .tx-amount{order:2;margin-left:auto;}
  .tx-item > .row-actions,.tx-item > .btn{order:3;flex-basis:100%;margin-top:8px;}
  .tx-item > .btn{width:100%;justify-content:center;}
}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid transparent;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-outline{background:var(--surface);color:var(--text);border-color:var(--border2);}
.btn-outline:hover{background:var(--surface2);}
.btn-danger{background:var(--red-light);color:var(--red-dark);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.icon-btn{background:transparent;border:none;cursor:pointer;color:var(--text3);padding:6px;border-radius:6px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--surface2);color:var(--text);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;}
.badge-green{background:var(--green-light);color:var(--green);}
.badge-red{background:var(--red-light);color:var(--red-dark);}
.badge-amber{background:var(--amber-light);color:var(--amber-dark);}
.badge-teal{background:var(--teal-light);color:var(--teal-dark);}
.badge-slate{background:var(--slate-light);color:var(--slate);}

.progress{height:8px;border-radius:100px;background:var(--surface2);overflow:hidden;}
.progress > div{height:100%;border-radius:100px;transition:width .3s;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.03em;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}

.empty{text-align:center;padding:36px 16px;color:var(--text3);}
.empty .big{font-size:32px;margin-bottom:8px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;background:var(--surface);color:var(--text);}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}

.purchase-item-row{display:flex;gap:8px;margin-bottom:6px;align-items:center;}
.purchase-item-row .pi-name{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);}
.purchase-item-row .pi-price{width:100px;flex-shrink:0;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);}
@media (max-width:480px){.purchase-item-row .pi-price{width:78px;}}

.type-toggle{display:flex;gap:6px;margin-bottom:14px;}
.type-toggle button{flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--text2);}
.type-toggle button.active[data-type="income"]{background:var(--green-light);border-color:var(--green);color:var(--green);}
.type-toggle button.active[data-type="expense"]{background:var(--red-light);border-color:var(--red);color:var(--red-dark);}
.type-toggle button.active[data-type="transfer"]{background:var(--slate-light);border-color:var(--slate);color:var(--slate);}

.tx-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);}
.tx-item:last-child{border-bottom:none;}
.tx-dot{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.tx-main{flex:1;min-width:0;}
.tx-main .t1{font-weight:700;font-size:13.5px;}
.tx-main .t2{font-size:12px;color:var(--text3);}
.tx-amount{font-weight:800;font-size:14px;white-space:nowrap;}
.tx-amount.income{color:var(--green);}
.tx-amount.expense{color:var(--red-dark);}
.tx-amount.transfer{color:var(--slate);}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,30,26,0.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
.modal{background:var(--surface);border-radius:var(--radius);max-width:460px;width:100%;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;font-weight:800;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

.landing{max-width:560px;margin:60px auto;text-align:center;}
.landing .brand-mark{width:56px;height:56px;font-size:24px;margin:0 auto 18px;}
.landing h1{font-size:28px;font-weight:800;margin-bottom:8px;}
.landing p{color:var(--text2);font-size:14px;line-height:1.6;margin-bottom:24px;}
.landing-options{display:grid;gap:14px;text-align:left;}
.share-box{display:flex;gap:8px;align-items:center;background:var(--teal-light);border:1px solid var(--teal);border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px;}
.share-box input{flex:1;border:none;background:transparent;font-size:13px;color:var(--teal-dark);font-weight:600;}
.banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;margin-bottom:16px;}
.banner-teal{background:var(--teal-light);color:var(--teal-dark);}
.banner-amber{background:var(--amber-light);color:var(--amber-dark);}
.setup-screen{max-width:640px;margin:40px auto;}
.setup-screen h1{font-size:22px;margin-bottom:6px;}
.setup-screen ol{margin:14px 0 14px 20px;line-height:1.9;font-size:13.5px;color:var(--text2);}
.setup-screen code,.setup-screen pre{background:var(--surface2);border-radius:6px;padding:2px 6px;font-size:12.5px;}
.setup-screen pre{padding:12px;overflow-x:auto;white-space:pre-wrap;}

.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:6px 6px 6px 12px;font-size:12.5px;font-weight:600;}
.chip .x{cursor:pointer;color:var(--text3);width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.chip .x:hover{background:var(--red-light);color:var(--red);}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px;color:var(--text3);}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.charts-row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
@media (min-width:821px){.charts-row.charts-row-even{grid-template-columns:1fr 1fr;}}
@media (max-width:820px){.charts-row{grid-template-columns:1fr;}}
.chart-box{position:relative;height:240px;}
.legend-list{margin-top:10px;display:flex;flex-direction:column;gap:7px;max-height:180px;overflow-y:auto;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.legend-item .name{flex:1;color:var(--text2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend-item .amt{font-weight:700;white-space:nowrap;}

@media print{
  .topbar,.tabs,.banner,#modal-root,.btn{display:none !important;}
  body{background:#fff;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
  .page-wrap{padding:0;max-width:100%;}
}

/* ---- Compact mobile density (kept last so it wins the cascade) ---- */
@media (max-width:520px){
  .grid-4{grid-template-columns:repeat(2,1fr);gap:8px;}
  .grid{gap:10px;}
  body{font-size:13px;}
  .page-wrap{padding:14px 12px 50px;}
  .card{padding:13px;border-radius:11px;}
  .card + .card{margin-top:10px;}
  .brand-mark{width:32px;height:32px;font-size:14px;border-radius:9px;}
  .brand-name{font-size:16px;}
  .brand-sub{font-size:10px;}
  .month-picker input{padding:6px 8px;font-size:12px;}
  .tabs-wrap{margin-bottom:14px;}
  .tab{padding:8px 10px;font-size:12px;gap:5px;}
  .stat-label{font-size:11px;}
  .stat-value{font-size:18px;margin-top:4px;}
  .section-title{font-size:14.5px;margin-bottom:9px;}
  .btn{padding:9px 14px;font-size:12.5px;}
  .btn-sm{padding:5px 9px;font-size:11.5px;}
  .field{margin-bottom:11px;}
  .field label{font-size:11.5px;margin-bottom:5px;}
  .field input,.field select,.field textarea{padding:9px 10px;font-size:13px;}
  .modal-head{padding:14px 16px;}
  .modal-body{padding:16px;}
  .tx-item{padding:8px 3px;gap:9px;}
  .tx-dot{width:33px;height:33px;font-size:15px;border-radius:9px;}
  .tx-main .t1{font-size:12.5px;}
  .tx-main .t2{font-size:11.5px;}
  td,th{padding:8px 7px;font-size:12.5px;}
  .chip{padding:5px 5px 5px 10px;font-size:11.5px;}
}
</style>
</head>

function escapeHtml(str){

function addMonths(monthKey, delta){
  let [y,m] = monthKey.split('-').map(Number);
  m += delta;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return `${y}-${String(m).padStart(2,'0')}`;
}

async function initSpaceSubscriptions(){
  render(); // show loading
  try{
    if(!auth.currentUser){
      await new Promise((resolve,reject)=>{
        const unsubAuth = onAuthStateChanged(auth, u=>{ if(u){unsubAuth(); resolve();} }, reject);
        signInAnonymously(auth).catch(reject);
      });
    }
  }catch(err){
    console.error(err);
  }
  state.authReady = true;
  clearSubs();
  unsubs.push(onValue(spaceRef(), snap=>{
    if(!snap.exists()){ state.notFound=true; state.space=null; forgetSpace(); render(); return; }
    const val = snap.val();
    state.space = {
      id: state.spaceId,
      name: val.name,
      currency: val.currency,
      createdAt: val.createdAt,
      members: objToArray(val.members),
      categories: objToArray(val.categories),
      accounts: objToArray(val.accounts),
    };
    state.transactions = objToArray(val.transactions).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    state.goals = objToArray(val.goals);
    state.debts = objToArray(val.debts);
    state.recurring = objToArray(val.recurring);
    state.budgetsAll = val.budgets || {};

function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function recurringStatusInfo(r){
  const currentMonth = monthNow();
  if((r.lastGenerated||'')===currentMonth) return {status:'paid', label:'Pagado este mes'};
  const [y,m] = currentMonth.split('-').map(Number);
  const day = Math.min(r.dueDay||1, daysInMonth(y,m));
  const due = new Date(y, m-1, day);
  const today = new Date(); today.setHours(0,0,0,0); due.setHours(0,0,0,0);
  const diffDays = Math.round((due-today)/86400000);
  if(diffDays<0) return {status:'overdue', label:`Venció hace ${Math.abs(diffDays)} día${Math.abs(diffDays)===1?'':'s'} · ${monthLabel(currentMonth)}`};
  if(diffDays<=7) return {status:'due-soon', label:`Vence ${diffDays===0?'hoy':'en '+diffDays+' día'+(diffDays===1?'':'s')} (${String(day).padStart(2,'0')}/${m})`};
  return {status:'upcoming', label:`Vence el ${String(day).padStart(2,'0')}/${m}`};
}

const recurringSettling = new Set();
async function settleRecurring(id){
  if(recurringSettling.has(id)) return;
  const r = state.recurring.find(x=>x.id===id);
  if(!r) return;
  const currentMonth = monthNow();
  if((r.lastGenerated||'')===currentMonth) return;
  recurringSettling.add(id);
  try{
    await Promise.all([
      set(spaceRef('transactions/'+uid(12)), {
        type:r.type, amount:r.amount, date: todayStr(), categoryId:r.categoryId,
        accountId:r.accountId, toAccountId:null, memberId:r.memberId||null,
        note:(r.note?r.note+' (recurrente)':'Recurrente')+' · '+monthLabel(currentMonth),
        recurringId:r.id, createdAt: serverTimestamp(),
      }),
      update(spaceRef('recurring/'+r.id), {lastGenerated: currentMonth}),
    ]);
  } finally { recurringSettling.delete(id); }
}
async function unsettleRecurring(id){
  const r = state.recurring.find(x=>x.id===id);
  if(!r) return;
  const currentMonth = monthNow();
  const linkedTx = state.transactions.find(t=>t.recurringId===r.id && monthKeyOf(t.date)===currentMonth);
  const ops = [update(spaceRef('recurring/'+id), {lastGenerated: ''})];
  if(linkedTx) ops.push(remove(spaceRef('transactions/'+linkedTx.id)));
  await Promise.all(ops);
}

function accountBalance(accountId){
  const acc = accountById(accountId);
  if(!acc) return 0;
  let bal = acc.initialBalance||0;
  for(const t of state.transactions){
    if(t.type==='income' && t.accountId===accountId) bal += t.amount;
    else if(t.type==='expense' && t.accountId===accountId) bal -= t.amount;
    else if(t.type==='transfer'){
      if(t.accountId===accountId) bal -= t.amount;
      if(t.toAccountId===accountId) bal += t.amount;
    }
  }
  return bal;
}

/* ---------------- Ticket OCR ---------------- */
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js';
    s.onload = resolve;
    s.onerror = ()=>reject(new Error('No se pudo cargar el lector de texto.'));
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}
async function runTicketOCR(file, statusEl){
  await loadTesseract();
  if(statusEl) statusEl.textContent = 'Leyendo ticket... 0%';
  const { data } = await Tesseract.recognize(file, 'spa', {
    logger: m=>{
      if(statusEl && m.status==='recognizing text') statusEl.textContent = `Leyendo ticket... ${Math.round((m.progress||0)*100)}%`;
    }
  });
  return data.text || '';
}
function parsePriceStr(s){
  let clean = String(s).replace(/\s/g,'');
  if(/,\d{2}$/.test(clean)) clean = clean.replace(/\./g,'').replace(',','.');
  else clean = clean.replace(/,/g,'');
  return parseFloat(clean) || 0;
}
function parseReceiptLineItems(text){
  const IGNORE_RE = /^(sub)?\s*total|iva\b|efectivo|tarjeta|vuelto|cambio|cuit|fecha|hora\b|ticket|caja\b|gracias|cliente|resumen|descuento|puntos/i;
  const priceRe = /(\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{2})?|\d+)\s*$/;
  const lines = String(text).split('\n').map(l=>l.trim()).filter(Boolean);
  const items = [];
  let detectedTotal = null;
  for(const line of lines){
    const m = line.match(priceRe);
    if(!m) continue;
    const price = parsePriceStr(m[1]);
    if(!(price>0)) continue;
    const namePart = line.slice(0, m.index).trim().replace(/[-–.:x]+$/i,'').trim();
    if(!namePart || namePart.length<2) continue;
    if(IGNORE_RE.test(namePart)){
      if(/total/i.test(namePart) && !/sub/i.test(namePart) && detectedTotal===null) detectedTotal = price;
      continue;
    }
    items.push({name: namePart, price});
  }
  return {items, detectedTotal};
}
function recomputePurchaseTotal(){
  const rows = document.querySelectorAll('#purchase-items-list .purchase-item-row');
  let sum = 0;
  rows.forEach(r=>{ const v = parseFloat(r.querySelector('.pi-price').value); if(!isNaN(v)) sum += v; });
  const totalInput = document.getElementById('purchase-total-input');
  if(totalInput) totalInput.value = sum ? Math.round(sum*100)/100 : '';
}
async function onTicketPhotoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const previewEl = document.getElementById('ticket-photo-preview');
  const statusEl = document.getElementById('ticket-ocr-status');
  if(previewEl) previewEl.innerHTML = `<img src="${URL.createObjectURL(file)}" style="max-width:150px;max-height:150px;border-radius:8px;border:1px solid var(--border);">`;
  try{
    if(statusEl) statusEl.textContent = 'Cargando lector de texto...';
    const text = await runTicketOCR(file, statusEl);
    const {items, detectedTotal} = parseReceiptLineItems(text);
    if(items.length){
      const list = document.getElementById('purchase-items-list');
      if(list) list.innerHTML = items.map(it=>purchaseItemRow(it)).join('');
    }
    recomputePurchaseTotal();
    if(detectedTotal){
      const totalInput = document.getElementById('purchase-total-input');
      if(totalInput) totalInput.value = Math.round(detectedTotal*100)/100;
    }
    if(statusEl) statusEl.textContent = items.length ? 'Ticket leído. Revisá y corregí la lista antes de guardar.' : 'No se reconocieron productos automáticamente. Cargalos a mano.';
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.textContent = 'No se pudo leer el ticket automáticamente. Cargá los productos a mano.';
  }
}
async function deletePurchase(id){
  const p = state.purchases.find(x=>x.id===id);
  if(!p) return;
  const ops = [remove(spaceRef('purchases/'+id))];
  if(p.txId) ops.push(remove(spaceRef('transactions/'+p.txId)));
  await Promise.all(ops);
}

/* ---------------- Shell ---------------- */
function renderShell(){
  const tabs = [
    ['dashboard',icon('dashboard',16)+' Panel'],['transactions',icon('transactions',16)+' Movimientos'],['budgets',icon('budgets',16)+' Presupuestos'],
    ['markets',icon('store',16)+' Mercados'],
    ['recurring',icon('recurring',16)+' Recurrentes'],['goals',icon('goals',16)+' Metas y deudas'],['reports',icon('reports',16)+' Reportes'],['settings',icon('settings',16)+' Configuración'],
  ];
  return `<div class="page-wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">💰</div>
        <div><div class="brand-name">${escapeHtml(state.space.name)}</div><div class="brand-sub">Finanzas Familiares</div></div>
      </div>
      <div class="month-picker">
        <input type="month" id="month-input" value="${state.currentMonth}">
      </div>
      <button class="btn btn-outline btn-sm" data-action="open-share">${icon('link',15)} Compartir</button>
    </div>
    ${state.justCreated ? `<div class="banner banner-teal">${icon('check',16)} Espacio creado. Tocá "Compartir" para enviarle el link a tu familia.</div>` : ''}
    <div class="tabs-wrap">
      <div class="tabs">
        ${tabs.map(([id,label])=>`<button class="tab ${state.activeTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}
      </div>
    </div>
    <div id="tab-content">${renderTab()}</div>
  </div>`;
}
function renderTab(){
  switch(state.activeTab){
    case 'dashboard': return renderDashboard();
    case 'transactions': return renderTransactions();
    case 'budgets': return renderBudgets();
    case 'markets': return renderMarkets();
    case 'recurring': return renderRecurring();
    case 'goals': return renderGoalsDebts();
    case 'reports': return renderReports();
    case 'settings': return renderSettings();
    default: return '';
  }
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const mt = monthTotals(state.currentMonth);
  const cats = (state.space.categories||[]).filter(c=>c.type==='expense');
  const overBudget = cats.map(c=>{
    const limit = getBudgetLimits(state.currentMonth)[c.id];
    if(!limit) return null;
    const spent = categorySpend(state.currentMonth, c.id);
    const pct = spent/limit;
    return {cat:c, limit, spent, pct};
  }).filter(x=>x && x.pct>=0.8).sort((a,b)=>b.pct-a.pct);

  const recent = txForMonth(state.currentMonth).slice(0,6);

  const pendingRecurring = (state.recurring||[])
    .filter(r=>r.active!==false)
    .map(r=>({r, info:recurringStatusInfo(r)}))
    .filter(x=>x.info.status!=='paid')
    .sort((a,b)=>(a.r.dueDay||1)-(b.r.dueDay||1));

  return `
  <div class="grid grid-4">
    <div class="card"><div class="stat-label">Balance total</div><div class="stat-value">${fmtMoney(totalBalance(), currency())}</div></div>
    <div class="card"><div class="stat-label">Ingresos del mes</div><div class="stat-value pos">${fmtMoney(mt.income, currency())}</div></div>
    <div class="card"><div class="stat-label">Gastos del mes</div><div class="stat-value neg">${fmtMoney(mt.expense, currency())}</div></div>
    <div class="card"><div class="stat-label">Balance del mes</div><div class="stat-value ${mt.balance>=0?'pos':'neg'}">${fmtMoney(mt.balance, currency())}</div></div>
  </div>

  ${overBudget.length ? `
  <div class="card">
    <div class="section-title"><span style="display:inline-flex;align-items:center;gap:8px;">${icon('warning',16)} Alertas de presupuesto</span> <span class="hint">${monthLabel(state.currentMonth)}</span></div>
    ${overBudget.map(o=>`
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <span>${o.cat.emoji} ${escapeHtml(o.cat.name)}</span>
          <span class="badge ${o.pct>=1?'badge-red':'badge-amber'}">${Math.round(o.pct*100)}%</span>
        </div>
        <div class="progress"><div style="width:${Math.min(o.pct*100,100)}%;background:${o.pct>=1?'var(--red)':'var(--amber)'};"></div></div>
      </div>`).join('')}
  </div>` : ''}

  <div class="charts-row charts-row-even">
    <div style="display:flex;flex-direction:column;gap:14px;">
      ${pendingRecurring.length ? `
      <div class="card">
        <div class="section-title"><span style="display:inline-flex;align-items:center;gap:8px;">${icon('recurring',16)} Recurrentes pendientes</span> <span class="hint">${monthLabel(monthNow())}</span></div>
        ${pendingRecurring.map(({r,info})=>{
          const cat = categoryById(r.categoryId);
          return `<div class="tx-item">
            <div class="tx-dot" style="background:var(--surface2);color:var(--teal-dark);">${cat?cat.emoji:icon('recurring',18)}</div>
            <div class="tx-main">
              <div class="t1">${cat?escapeHtml(cat.name):'Recurrente'}${r.note?' · '+escapeHtml(r.note):''}</div>
              <div class="t2"><span class="badge ${recurringBadgeClass(info.status)}">${info.label}</span></div>
            </div>
            <div class="tx-amount ${r.type}">${r.type==='income'?'+':'-'}${fmtMoney(r.amount, currency())}</div>
            <button class="btn btn-primary btn-sm" data-action="settle-recurring" data-id="${r.id}">Saldar</button>
          </div>`;
        }).join('')}
      </div>` : ''}
      <div class="card">
        <div class="section-title">Últimos movimientos</div>
        ${recent.length ? recent.map(txItemHtml).join('') : `<div class="empty">Sin movimientos este mes</div>`}
      </div>
    </div>
    <div class="card">
      <div class="section-title">Gastos por categoría <span class="hint">${monthLabel(state.currentMonth)}</span></div>
      <div class="chart-box"><canvas id="chart-dash-cat"></canvas></div>
      <div class="legend-list" id="legend-dash-cat"></div>
    </div>
  </div>
  `;
}
function txItemHtml(t){
  const cat = categoryById(t.categoryId);
  const acc = accountById(t.accountId);
  const mem = memberById(t.memberId);
  const glyph = t.type==='transfer' ? icon('transactions',18) : (cat?.emoji || '•');
  const sign = t.type==='income'?'+':(t.type==='expense'?'-':'');
  return `<div class="tx-item">
    <div class="tx-dot" style="background:var(--surface2);color:var(--slate);">${glyph}</div>
    <div class="tx-main">
      <div class="t1">${cat ? escapeHtml(cat.name) : (t.type==='transfer'?'Transferencia':'Movimiento')}</div>
      <div class="t2">${fmtDate(t.date)} · ${acc?escapeHtml(acc.name):''}${mem?' · '+escapeHtml(mem.name):''}${t.note?' · '+escapeHtml(t.note):''}</div>
    </div>
    <div class="tx-amount ${t.type}">${sign}${fmtMoney(t.amount, currency())}</div>
  </div>`;
}

/* ---------------- Transactions ---------------- */
function renderTransactions(){
  const accounts = state.space.accounts||[];
  const categories = state.space.categories||[];
  const members = state.space.members||[];
  let list = txForMonth(state.currentMonth);
  if(state.filters.account) list = list.filter(t=>t.accountId===state.filters.account);
  if(state.filters.category) list = list.filter(t=>t.categoryId===state.filters.category);
  if(state.filters.member) list = list.filter(t=>t.memberId===state.filters.member);
  if(state.filters.type) list = list.filter(t=>t.type===state.filters.type);

  return `
  <div class="card">
    <div class="section-title">Movimientos <span class="hint">${monthLabel(state.currentMonth)}</span>
      <button class="btn btn-primary btn-sm" data-action="new-transaction">+ Nuevo movimiento</button>
    </div>
    <div class="grid grid-4" style="margin-bottom:14px;">
      <select id="f-type"><option value="">Todos los tipos</option><option value="income">Ingresos</option><option value="expense">Gastos</option><option value="transfer">Transferencias</option></select>
      <select id="f-account"><option value="">Todas las cuentas</option>${accounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}</select>
      <select id="f-category"><option value="">Todas las categorías</option>${categories.map(c=>`<option value="${c.id}">${c.emoji} ${escapeHtml(c.name)}</option>`).join('')}</select>
      <select id="f-member"><option value="">Todos los integrantes</option>${members.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('')}</select>
    </div>
    ${list.length ? list.map(t=>renderTxRow(t)).join('') : `<div class="empty"><div class="big">${icon('receipt',32)}</div>Sin movimientos con estos filtros</div>`}
  </div>`;
}
function renderTxRow(t){
  const cat = categoryById(t.categoryId);
  const acc = accountById(t.accountId);
  const toAcc = t.toAccountId ? accountById(t.toAccountId) : null;
  const mem = memberById(t.memberId);
  const sign = t.type==='income'?'+':(t.type==='expense'?'-':'');
  return `<div class="tx-item">
    <div class="tx-dot" style="background:var(--surface2);color:var(--slate);">${t.type==='transfer'?icon('transactions',18):(cat?.emoji||'•')}</div>
    <div class="tx-main">
      <div class="t1">${cat ? escapeHtml(cat.name) : 'Transferencia'} ${t.type==='transfer' && acc && toAcc ? `· ${escapeHtml(acc.name)} → ${escapeHtml(toAcc.name)}`:''}</div>
      <div class="t2">${fmtDate(t.date)}${acc && t.type!=='transfer'?' · '+escapeHtml(acc.name):''}${mem?' · '+escapeHtml(mem.name):''}${t.note?' · '+escapeHtml(t.note):''}</div>
    </div>
    <div class="tx-amount ${t.type}">${sign}${fmtMoney(t.amount, currency())}</div>
    <div class="row-actions">
      <button class="icon-btn" data-action="edit-transaction" data-id="${t.id}">${icon('edit',16)}</button>
      <button class="icon-btn" data-action="delete-transaction" data-id="${t.id}">${icon('trash',16)}</button>
    </div>
  </div>`;
}

/* ---------------- Budgets ---------------- */
function renderBudgets(){
  const cats = (state.space.categories||[]).filter(c=>c.type==='expense');
  const limits = getBudgetLimits(state.currentMonth);
  const totalLimit = cats.reduce((s,c)=>s+(limits[c.id]||0),0);
  const totalSpent = cats.reduce((s,c)=>s+categorySpend(state.currentMonth, c.id),0);
  const totalPct = totalLimit>0 ? totalSpent/totalLimit : 0;
  const totalColor = totalPct>=1?'var(--red)':(totalPct>=0.8?'var(--amber)':'var(--teal)');
  return `
  <div class="card">
    <div class="section-title">Presupuestos <span class="hint">${monthLabel(state.currentMonth)}</span>
      <button class="btn btn-outline btn-sm" data-action="copy-prev-budget">Copiar del mes anterior</button>
    </div>
    <form data-form="budgets">
      <div class="table-wrap"><table>
        <thead><tr><th>Categoría</th><th>Límite mensual</th><th>Gastado</th><th style="width:160px;">Progreso</th></tr></thead>
        <tbody>
        ${cats.map(c=>{
          const limit = limits[c.id]||0;
          const spent = categorySpend(state.currentMonth, c.id);
          const pct = limit>0 ? spent/limit : 0;
          const color = pct>=1?'var(--red)':(pct>=0.8?'var(--amber)':'var(--teal)');
          return `<tr>
            <td>${c.emoji} ${escapeHtml(c.name)}</td>
            <td style="max-width:160px;"><input type="number" min="0" step="1" name="limit_${c.id}" value="${limit||''}" placeholder="0"></td>
            <td>${fmtMoney(spent, currency())}</td>
            <td><div class="progress"><div style="width:${Math.min(pct*100,100)}%;background:${color};"></div></div></td>
          </tr>`;
        }).join('')}
        </tbody>
        ${cats.length ? `<tfoot><tr style="font-weight:600;border-top:2px solid var(--border);">
          <td>Total</td>
          <td>${fmtMoney(totalLimit, currency())}</td>
          <td>${fmtMoney(totalSpent, currency())}</td>
          <td><div class="progress"><div style="width:${Math.min(totalPct*100,100)}%;background:${totalColor};"></div></div></td>
        </tr></tfoot>` : ''}
      </table></div>
      <button class="btn btn-primary" type="submit" style="margin-top:14px;">Guardar presupuestos</button>
    </form>
  </div>`;
}

/* ---------------- Markets (compras / tickets) ---------------- */
function renderMarkets(){
  const selected = state.selectedMarketId ? state.markets.find(m=>m.id===state.selectedMarketId) : null;
  if(state.selectedMarketId && !selected) state.selectedMarketId = null;
  if(selected) return renderMarketDetail(selected);
  const markets = state.markets;
  return `
  <div class="card">
    <div class="section-title">
      <span style="display:inline-flex;align-items:center;gap:8px;">${icon('store',16)} Mercados</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" data-action="new-market">+ Nuevo mercado</button>
        <button class="btn btn-primary btn-sm" data-action="new-purchase">${icon('camera',15)} Nueva compra</button>
      </div>
    </div>
    <p style="font-size:12.5px;color:var(--text2);margin-bottom:12px;">Sacale una foto al ticket para cargar la lista de productos automáticamente, o cargalos a mano. Cada mercado guarda el historial de lo comprado ahí.</p>
    ${markets.length ? `<div class="grid grid-3">
      ${markets.map(m=>{
        const total = marketTotalSpent(m.id);
        const count = purchasesForMarket(m.id).length;
        return `<div class="card" style="box-shadow:none;border-color:var(--border);cursor:pointer;" data-action="view-market" data-id="${m.id}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <b>${escapeHtml(m.name)}</b>
            <button class="icon-btn" data-action="delete-market" data-id="${m.id}" title="Eliminar mercado">${icon('trash',15)}</button>
          </div>
          <div style="font-size:12.5px;color:var(--text2);margin:8px 0 2px;">${count} compra${count===1?'':'s'} registrada${count===1?'':'s'}</div>
          <div class="stat-value neg" style="font-size:18px;">${fmtMoney(total, currency())}</div>
        </div>`;
      }).join('')}
    </div>` : `<div class="empty">Sin mercados todavía. Creá uno y sacale una foto a tu próximo ticket.</div>`}
  </div>`;
}
function renderMarketDetail(m){
  const purchases = purchasesForMarket(m.id).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const total = marketTotalSpent(m.id);
  return `
  <div class="card">
    <div class="section-title">
      <span style="display:inline-flex;align-items:center;gap:8px;">
        <button class="icon-btn" data-action="back-to-markets" title="Volver a mercados">${icon('undo',16)}</button>
        ${icon('store',16)} ${escapeHtml(m.name)}
      </span>
      <button class="btn btn-primary btn-sm" data-action="new-purchase" data-market-id="${m.id}">${icon('camera',15)} Nueva compra</button>
    </div>
    <div style="margin-bottom:14px;"><div class="stat-label">Total gastado acá</div><div class="stat-value neg">${fmtMoney(total, currency())}</div></div>
    ${purchases.length ? purchases.map(p=>`
      <div class="card" style="box-shadow:none;border-color:var(--border);margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <b>${fmtDate(p.date)}</b>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="tx-amount expense">${fmtMoney(p.total, currency())}</span>
            <button class="icon-btn" data-action="delete-purchase" data-id="${p.id}">${icon('trash',15)}</button>
          </div>
        </div>
        ${(p.items||[]).length ? `<ul style="margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--text2);">
          ${p.items.map(it=>`<li style="margin-bottom:2px;">${escapeHtml(it.name)} — ${fmtMoney(it.price, currency())}</li>`).join('')}
        </ul>` : ''}
      </div>
    `).join('') : `<div class="empty">Sin compras registradas en este mercado todavía</div>`}

}
let purchaseItemSeq = 0;
function purchaseItemRow(item){
  const rid = 'pi'+(purchaseItemSeq++);
  return `<div class="purchase-item-row" data-row-id="${rid}">
    <input type="text" class="pi-name" value="${escapeHtml(item?.name||'')}" placeholder="Producto">
    <input type="number" class="pi-price" min="0" step="0.01" value="${item?.price??''}" placeholder="Precio">
    <button type="button" class="icon-btn" data-action="remove-purchase-item">${icon('trash',15)}</button>
  </div>`;
}

/* ---------------- Recurring ---------------- */
function renderRecurring(){
  const list = state.recurring||[];
  const activeList = list.filter(r=>r.active!==false);
  const totalExpense = activeList.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
  const totalIncome = activeList.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  return `
  <div class="card">
    <div class="section-title"><span style="display:inline-flex;align-items:center;gap:8px;">${icon('recurring',16)} Movimientos recurrentes</span> <button class="btn btn-primary btn-sm" data-action="new-recurring">+ Nuevo recurrente</button></div>
    <p style="font-size:12.5px;color:var(--text3);margin-bottom:12px;">Pensado para sueldo, alquiler, suscripciones, etc. Cada mes tocá <b>Saldar</b> para confirmarlo — no se generan solos.</p>
    ${list.length ? list.map(renderRecurringRow).join('') : `<div class="empty">Sin movimientos recurrentes</div>`}
    ${list.length ? `
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;gap:20px;flex-wrap:wrap;">
      <div><div class="stat-label">Total gastos recurrentes / mes</div><div class="stat-value neg">${fmtMoney(totalExpense, currency())}</div></div>
      ${totalIncome>0 ? `<div><div class="stat-label">Total ingresos recurrentes / mes</div><div class="stat-value pos">${fmtMoney(totalIncome, currency())}</div></div>` : ''}
    </div>` : ''}
  </div>`;
}
function renderRecurringRow(r){
  const cat = categoryById(r.categoryId);
  const acc = accountById(r.accountId);
  const sign = r.type==='income'?'+':'-';
  const info = recurringStatusInfo(r);
  return `<div class="tx-item">
    <div class="tx-dot" style="background:var(--surface2);color:var(--teal-dark);">${cat?cat.emoji:icon('recurring',18)}</div>
    <div class="tx-main">
      <div class="t1">${cat?escapeHtml(cat.name):'Recurrente'} ${r.active===false?'<span class="badge badge-slate">Pausado</span>':''}</div>
      <div class="t2">${acc?escapeHtml(acc.name):''}${r.note?' · '+escapeHtml(r.note):''}</div>
      <div style="margin-top:5px;">${r.active===false?'':`<span class="badge ${recurringBadgeClass(info.status)}">${info.label}</span>`}</div>
    </div>
    <div class="tx-amount ${r.type}">${sign}${fmtMoney(r.amount, currency())}</div>
    <div class="row-actions">
      ${(r.active!==false && info.status!=='paid') ? `<button class="btn btn-primary btn-sm" data-action="settle-recurring" data-id="${r.id}">Saldar</button>` : ''}
      ${info.status==='paid' ? `<button class="icon-btn" data-action="unsettle-recurring" data-id="${r.id}" title="Marcar como no pagado">${icon('undo',16)}</button>` : ''}
      <button class="icon-btn" data-action="toggle-recurring" data-id="${r.id}">${r.active===false?icon('play',16):icon('pause',16)}</button>
      <button class="icon-btn" data-action="edit-recurring" data-id="${r.id}">${icon('edit',16)}</button>
      <button class="icon-btn" data-action="delete-recurring" data-id="${r.id}">${icon('trash',16)}</button>
    </div>
  </div>`;
}

/* ---------------- Goals & Debts ---------------- */

          </div>

/* ---------------- Bind shell events ---------------- */
function bindShell(){
  const app = document.getElementById('app');
  app.addEventListener('click', onShellClick);
  app.addEventListener('submit', onShellSubmit, true);
  app.addEventListener('change', onShellChange);
  const monthInput = document.getElementById('month-input');
  if(monthInput) monthInput.addEventListener('change', e=>{
    state.currentMonth = e.target.value;
    render();
  });
  document.getElementById('modal-root').addEventListener('click', onModalClick);
  document.getElementById('modal-root').addEventListener('submit', onModalSubmit);
  document.getElementById('modal-root').addEventListener('change', onModalChange);
}
function onModalChange(e){
  if(e.target.name==='categoryId'){
    const form = e.target.closest('form');
    if(form && form.dataset.form==='transaction') updateLenderFieldVisibility(form);
  }
  if(e.target.id==='purchase-market-select'){
    const field = document.querySelector('[data-field="new-market"]');
    const input = field ? field.querySelector('input[name=newMarketName]') : null;
    const isNew = e.target.value==='__new__';
    if(field) field.style.display = isNew ? '' : 'none';
    if(input) input.required = isNew;
    return;
  }
  if(e.target.id==='ticket-photo-input'){ onTicketPhotoSelected(e); return; }
  if(e.target.classList.contains('pi-price')){ recomputePurchaseTotal(); return; }
}
function updateLenderFieldVisibility(form){
  if(!form) return;
  const type = form.querySelector('input[name=type]')?.value;
  const catId = form.querySelector('select[name=categoryId]')?.value;
  const field = form.querySelector('[data-field=lender]');
  if(field) field.style.display = (type==='income' && categoryIsLoan(catId)) ? '' : 'none';
}
function onShellChange(e){
  if(e.target.id==='f-account'){ state.filters.account = e.target.value; render(); }
  if(e.target.id==='f-category'){ state.filters.category = e.target.value; render(); }
  if(e.target.id==='f-member'){ state.filters.member = e.target.value; render(); }
  if(e.target.id==='f-type'){ state.filters.type = e.target.value; render(); }
}
function onShellClick(e){
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ state.activeTab = tabBtn.dataset.tab; render(); return; }
  const a = e.target.closest('[data-action]');
  if(!a) return;
  const action = a.dataset.action;
  const id = a.dataset.id;
  switch(action){
    case 'open-share': openModal(modalShare()); break;
    case 'copy-link': copyToClipboard(document.getElementById('share-url-input').value); break;
    case 'new-transaction': openModal(modalTransactionForm(null)); updateLenderFieldVisibility(document.querySelector('form[data-form=transaction]')); break;
    case 'edit-transaction': openModal(modalTransactionForm(state.transactions.find(t=>t.id===id))); updateLenderFieldVisibility(document.querySelector('form[data-form=transaction]')); break;
    case 'delete-transaction': if(confirm('¿Eliminar este movimiento?')) remove(spaceRef('transactions/'+id)); break;
    case 'new-goal': openModal(modalGoalForm(null)); break;
    case 'contribute-goal': openModal(modalContributeGoal(state.goals.find(g=>g.id===id))); break;
    case 'delete-goal': if(confirm('¿Eliminar esta meta?')) remove(spaceRef('goals/'+id)); break;
    case 'new-debt': openModal(modalDebtForm(null)); break;
    case 'pay-debt': {
      const d = state.debts.find(x=>x.id===id);
      if((d.remainingAmount??d.totalAmount)<=0){ alert('Esta deuda ya está saldada.'); break; }
      openModal(modalPayDebt(d, false));
      break;
    }
    case 'settle-debt': {
      const d = state.debts.find(x=>x.id===id);
      if((d.remainingAmount??d.totalAmount)<=0){ alert('Esta deuda ya está saldada.'); break; }
      openModal(modalPayDebt(d, true));
      break;
    }
    case 'delete-debt': if(confirm('¿Eliminar esta deuda?')) remove(spaceRef('debts/'+id)); break;
    case 'copy-prev-budget': copyPrevBudget(); break;
    case 'new-recurring': openModal(modalRecurringForm(null)); break;
    case 'edit-recurring': openModal(modalRecurringForm(state.recurring.find(r=>r.id===id))); break;
    case 'toggle-recurring': { const r = state.recurring.find(x=>x.id===id); update(spaceRef('recurring/'+id), { active: r.active===false }); break; }
    case 'settle-recurring': settleRecurring(id); break;
    case 'unsettle-recurring': if(confirm('¿Marcar como no pagado? Se va a borrar el movimiento que se generó.')) unsettleRecurring(id); break;
    case 'delete-recurring': if(confirm('¿Eliminar este recurrente?')) remove(spaceRef('recurring/'+id)); break;
    case 'export-csv': exportCSV(); break;
    case 'export-pdf': exportPdf(); break;
    case 'new-member': openModal(modalMemberForm()); break;
    case 'remove-member': if(confirm('¿Quitar integrante?')) removeSpaceChild('members', id); break;
    case 'new-account': openModal(modalAccountForm()); break;
    case 'remove-account': if(confirm('¿Eliminar cuenta?')) removeSpaceChild('accounts', id); break;
    case 'new-category': openModal(modalCategoryForm()); break;
    case 'remove-category': if(confirm('¿Eliminar categoría?')) removeSpaceChild('categories', id); break;
    case 'new-market': openModal(modalMarketForm()); break;
    case 'view-market': state.selectedMarketId = id; render(); break;
    case 'back-to-markets': state.selectedMarketId = null; render(); break;
    case 'delete-market': if(confirm('¿Eliminar este mercado? Las compras ya registradas no se borran, pero quedan sin mercado asociado.')) removeSpaceChild('markets', id); break;
    case 'new-purchase': openModal(modalNewPurchase(a.dataset.marketId || null)); break;
    case 'delete-purchase': if(confirm('¿Eliminar esta compra? También se va a borrar el gasto asociado.')) deletePurchase(id); break;
    case 'delete-space': deleteSpace(); break;
  }
}
function onModalClick(e){
  if(e.target.closest('[data-action="close-modal"]') || e.target.dataset.action==='close-modal-backdrop' && e.target===e.currentTarget){ closeModal(); return; }
  if(e.target.id==='modal-inner') return;
  if(e.target.closest('[data-action="close-modal-backdrop"]') && e.target.classList.contains('modal-backdrop')){ closeModal(); return; }
  if(e.target.closest('[data-action="copy-link-modal"]')){ copyToClipboard(document.getElementById('share-url-input-modal').value); return; }
  if(e.target.closest('[data-action="pick-ticket-photo"]')){ document.getElementById('ticket-photo-input')?.click(); return; }
  if(e.target.closest('[data-action="add-purchase-item"]')){
    const list = document.getElementById('purchase-items-list');
    if(list) list.insertAdjacentHTML('beforeend', purchaseItemRow());
    return;
  }
  if(e.target.closest('[data-action="remove-purchase-item"]')){
    const row = e.target.closest('.purchase-item-row');
    if(row){ row.remove(); recomputePurchaseTotal(); }
    return;
  }
  const typeBtn = e.target.closest('[data-type]');
  if(typeBtn && typeBtn.closest('.type-toggle')){
    const form = typeBtn.closest('form');
    form.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active'));
    typeBtn.classList.add('active');
    form.querySelector('input[name=type]').value = typeBtn.dataset.type;
    const type = typeBtn.dataset.type;
    const catField = form.querySelector('[data-field=category]');
    const toAccField = form.querySelector('[data-field=toAccount]');
    if(catField) catField.style.display = type==='transfer' ? 'none' : '';
    if(toAccField) toAccField.style.display = type==='transfer' ? '' : 'none';
    const categories = state.space.categories||[];
    form.querySelector('select[name=categoryId]').innerHTML = categories.filter(c=>c.type===type).map(c=>`<option value="${c.id}">${c.emoji} ${escapeHtml(c.name)}</option>`).join('');
    updateLenderFieldVisibility(form);
  }
}
function copyToClipboard(text){
  navigator.clipboard?.writeText(text).then(()=>{}, ()=>{});
}

/* ---------------- Submit handlers ---------------- */
async function onShellSubmit(e){
  if(e.target.dataset.form==='budgets'){
    e.preventDefault();
    const fd = new FormData(e.target);
    const limits = {};
    for(const [k,v] of fd.entries()){
      if(k.startsWith('limit_') && v) limits[k.replace('limit_','')] = Number(v);
    }
    await update(spaceRef('budgets/'+state.currentMonth), {limits});
  }
  if(e.target.dataset.form==='space-settings'){
    e.preventDefault();
    const fd = new FormData(e.target);
    await update(spaceRef(), {name: fd.get('name'), currency: fd.get('currency')});
  }
}
async function onModalSubmit(e){
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const formType = form.dataset.form;
  const btn = form.querySelector('button[type=submit]');
  if(btn){ btn.disabled=true; }
  try{
    if(formType==='transaction'){
      const id = form.dataset.id;
      const data = {
        type: fd.get('type'),
        amount: Number(fd.get('amount')),
        date: fd.get('date'),
        categoryId: fd.get('type')==='transfer' ? null : fd.get('categoryId'),
        accountId: fd.get('accountId'),
        toAccountId: fd.get('type')==='transfer' ? fd.get('toAccountId') : null,
        memberId: fd.get('memberId') || null,
        note: fd.get('note') || '',
      };
      const isNewLoan = !id && data.type==='income' && categoryIsLoan(data.categoryId);
      if(isNewLoan) data.lenderName = fd.get('lenderName') || '';
      if(id){
        await update(spaceRef('transactions/'+id), data);
      } else {
        const newTxId = uid(12);
        await set(spaceRef('transactions/'+newTxId), {...data, createdAt: serverTimestamp()});
        if(isNewLoan){
          await set(spaceRef('debts/'+uid(10)), {
            name: data.lenderName ? 'Préstamo de '+data.lenderName : 'Préstamo',
            totalAmount: data.amount,
            remainingAmount: data.amount,
            monthlyPayment: null,
            linkedTransactionId: newTxId,
          });
        }
      }
    }
    if(formType==='goal'){
      const id = form.dataset.id;
      const data = { name: fd.get('name'), targetAmount: Number(fd.get('targetAmount')), currentAmount: Number(fd.get('currentAmount')||0), deadline: fd.get('deadline')||null };
      if(id) await update(spaceRef('goals/'+id), data);
      else await set(spaceRef('goals/'+uid(10)), data);
    }
    if(formType==='goal-contribute'){
      const id = form.dataset.id;
      const g = state.goals.find(x=>x.id===id);
      await update(spaceRef('goals/'+id), { currentAmount: (g.currentAmount||0) + Number(fd.get('amount')) });
    }
    if(formType==='debt'){
      const id = form.dataset.id;
      const data = { name: fd.get('name'), totalAmount: Number(fd.get('totalAmount')), remainingAmount: Number(fd.get('remainingAmount')||fd.get('totalAmount')), monthlyPayment: fd.get('monthlyPayment')?Number(fd.get('monthlyPayment')):null };
      if(id) await update(spaceRef('debts/'+id), data);
      else await set(spaceRef('debts/'+uid(10)), data);
    }
    if(formType==='debt-pay'){
      const id = form.dataset.id;
      const d = state.debts.find(x=>x.id===id);
      const amount = Number(fd.get('amount'));
      const accountId = fd.get('accountId');
      const remaining = Math.max(0, (d.remainingAmount??d.totalAmount) - amount);
      const debtCat = (state.space.categories||[]).find(c=>c.debtCategory);
      await Promise.all([
        update(spaceRef('debts/'+id), { remainingAmount: remaining }),
        set(spaceRef('transactions/'+uid(12)), {
          type:'expense', amount, date: todayStr(),
          categoryId: debtCat ? debtCat.id : null,
          accountId, toAccountId:null, memberId:null,
          note: 'Pago deuda: '+d.name, linkedDebtId:id, createdAt: serverTimestamp(),
        }),
      ]);
    }
    if(formType==='recurring'){
      const id = form.dataset.id;
      const data = {
        type: fd.get('type'),
        amount: Number(fd.get('amount')),
        categoryId: fd.get('categoryId'),
        accountId: fd.get('accountId'),
        memberId: fd.get('memberId') || null,
        note: fd.get('note') || '',
        dueDay: Math.min(31, Math.max(1, Number(fd.get('dueDay'))||10)),
      };
      if(id) await update(spaceRef('recurring/'+id), data);
      else await set(spaceRef('recurring/'+uid(10)), {...data, active:true, startMonth: monthNow(), lastGenerated:''});
    }
    if(formType==='member'){
      const members = state.space.members||[];
      const color = MEMBER_COLORS[members.length % MEMBER_COLORS.length];
      await set(spaceRef('members/'+uid(8)), { name: fd.get('name'), color });
    }
    if(formType==='account'){
      await set(spaceRef('accounts/'+uid(8)), { name: fd.get('name'), icon:'💳', initialBalance: Number(fd.get('initialBalance')||0) });
    }
    if(formType==='category'){
      const catData = { type: fd.get('type'), name: fd.get('name'), emoji: fd.get('emoji')||'🏷️' };
      if(fd.get('loan')==='on') catData.loan = true;
      await set(spaceRef('categories/'+uid(8)), catData);
    }
    if(formType==='market'){
      await set(spaceRef('markets/'+uid(8)), { name: fd.get('name'), createdAt: serverTimestamp() });
    }
    if(formType==='purchase'){
      const marketSelect = form.querySelector('#purchase-market-select');
      let marketId = marketSelect.value;
      let marketName;
      const newMarketName = (fd.get('newMarketName')||'').trim();
      if(marketId==='__new__'){
        if(!newMarketName) throw new Error('Ingresá el nombre del mercado.');
        marketId = uid(8);
        marketName = newMarketName;
        await set(spaceRef('markets/'+marketId), { name: marketName, createdAt: serverTimestamp() });
      } else {
        marketName = state.markets.find(x=>x.id===marketId)?.name || '';
      }
      const items = [];
      form.querySelectorAll('.purchase-item-row').forEach(r=>{
        const name = r.querySelector('.pi-name').value.trim();
        const price = Number(r.querySelector('.pi-price').value)||0;
        if(name) items.push({name, price});
      });
      const total = Number(fd.get('total')) || items.reduce((s,it)=>s+it.price,0);
      if(!(total>0)) throw new Error('Ingresá el total de la compra.');
      const purchaseId = uid(12);
      const txId = uid(12);
      await Promise.all([
        set(spaceRef('purchases/'+purchaseId), {
          marketId, items, total, date: fd.get('date'),
          accountId: fd.get('accountId'), categoryId: fd.get('categoryId'),
          txId, createdAt: serverTimestamp(),
        }),
        set(spaceRef('transactions/'+txId), {
          type:'expense', amount: total, date: fd.get('date'), categoryId: fd.get('categoryId'),
          accountId: fd.get('accountId'), toAccountId:null, memberId:null,
          note: 'Compra en '+(marketName||'mercado'), marketPurchaseId: purchaseId, createdAt: serverTimestamp(),
        }),
      ]);
    }
    closeModal();
  }catch(err){
    alert('Ocurrió un error: ' + err.message);
    if(btn) btn.disabled=false;
  }
}
function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportCSV(){
  const rows = [['Fecha','Tipo','Categoría','Cuenta','Integrante','Monto','Nota']];
  state.transactions.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(t=>{
    rows.push([
      t.date,
      t.type==='income'?'Ingreso':(t.type==='expense'?'Gasto':'Transferencia'),
      categoryById(t.categoryId)?.name || '',
      accountById(t.accountId)?.name || '',
      memberById(t.memberId)?.name || '',
      t.amount,
      t.note||'',
    ]);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finanzas-${(state.space.name||'espacio').replace(/[^a-z0-9]+/gi,'-')}-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportPdf(){
  state.activeTab = 'reports';
  render();
  setTimeout(()=>window.print(), 350);
}
async function copyPrevBudget(){
  const prev = addMonths(state.currentMonth,-1);
  const snap = await get(spaceRef('budgets/'+prev));
  if(snap.exists()) await update(spaceRef('budgets/'+state.currentMonth), { limits: snap.val().limits || {} });
}
async function removeSpaceChild(field, id){
  await remove(spaceRef(field+'/'+id));
}
async function deleteSpace(){
  if(!confirm('Esto borra el espacio para todos. ¿Estás seguro?')) return;
  if(!confirm('Última confirmación: esta acción no se puede deshacer.')) return;
  await remove(spaceRef());
  state.spaceId=null; state.space=null; clearSubs();
  forgetSpace();
  history.replaceState(null,'', location.pathname);
  render();
}

/* ---------------- Charts ---------------- */
function destroyChart(key){ if(charts[key]){ charts[key].destroy(); delete charts[key]; } }
function renderChartsForTab(){
  if(typeof Chart==='undefined') return;
  if(state.activeTab==='dashboard'){
    const ctx = document.getElementById('chart-dash-cat');
    if(ctx) renderCategoryDoughnut(ctx, 'chart-dash-cat', state.currentMonth, 'legend-dash-cat');
  }
  if(state.activeTab==='reports'){
    const ctxTrend = document.getElementById('chart-trend');
    if(ctxTrend) renderTrendChart(ctxTrend);
    const ctxCat = document.getElementById('chart-report-cat');
    if(ctxCat) renderCategoryDoughnut(ctxCat, 'chart-report-cat', state.currentMonth, 'legend-report-cat');
  }
}
function renderCategoryDoughnut(ctx, key, monthKey, legendElId){
  destroyChart(key);
  const legendEl = legendElId ? document.getElementById(legendElId) : null;
  const cats = (state.space.categories||[]).filter(c=>c.type==='expense');
  const palette = ['#1F6F5C','#B9821F','#7A5A8A','#4A5C68','#B23B30','#2E7D46','#C8625A','#5A7080','#94A69B','#8A611A'];
  const entries = cats
    .map((c,i)=>({cat:c, amount: categorySpend(monthKey, c.id)||0, color: palette[i%palette.length]}))
    .filter(e=>e.amount>0)
    .sort((a,b)=>b.amount-a.amount);
  const total = entries.reduce((s,e)=>s+e.amount,0);

  if(total===0){
    charts[key] = new Chart(ctx, {type:'doughnut', data:{labels:['Sin gastos'], datasets:[{data:[1], backgroundColor:['#E4ECEF']}]}, options:{plugins:{legend:{display:false}}}});
    if(legendEl) legendEl.innerHTML = '';
    return;
  }
  charts[key] = new Chart(ctx, {
    type:'doughnut',
    data:{ labels: entries.map(e=>e.cat.name), datasets:[{ data: entries.map(e=>e.amount), backgroundColor: entries.map(e=>e.color) }] },
    options:{ maintainAspectRatio:false, plugins:{legend:{display:false}} }
  });
  if(legendEl){
    legendEl.innerHTML = entries.map(e=>{
      const pct = Math.round(e.amount/total*100);
      return `<div class="legend-item"><span class="legend-dot" style="background:${e.color};"></span><span class="name">${e.cat.emoji} ${escapeHtml(e.cat.name)}</span><span class="amt">${fmtMoney(e.amount, currency())} · ${pct}%</span></div>`;
    }).join('');
  }
}
function renderTrendChart(ctx){
  destroyChart('chart-trend');
  const months = last6Months(state.currentMonth);
  const incomeData = months.map(m=>monthTotals(m).income);
  const expenseData = months.map(m=>monthTotals(m).expense);
  charts['chart-trend'] = new Chart(ctx, {
    type:'bar',
    data:{
      labels: months.map(m=>monthLabel(m)),
      datasets:[
        {label:'Ingresos', data:incomeData, backgroundColor:'#2E7D46'},
        {label:'Gastos', data:expenseData, backgroundColor:'#B23B30'},
      ]
    },
    options:{ maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}} }
  });
}

/* ---------------- Service worker (PWA) ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

/* ---------------- Boot ---------------- */
if(NEEDS_SETUP){
  render();
} else if(state.spaceId){
  rememberSpace(state.spaceId);
  initSpaceSubscriptions();
} else {
  let remembered = null;
  try{ remembered = localStorage.getItem(LAST_SPACE_KEY); }catch(e){}
  if(remembered){
    state.spaceId = remembered;
    history.replaceState(null,'', location.pathname + '?space=' + remembered);
    initSpaceSubscriptions();
  } else {
    render();
  }
}
